name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/PropertyManagement.slnx

      - name: Build
        run: dotnet build backend/PropertyManagement.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/PropertyManagement.Tests/PropertyManagement.Tests.csproj --configuration Release --no-build
