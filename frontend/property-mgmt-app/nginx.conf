server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Angular routing — always serve index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy .NET API calls to avoid CORS in production
    location /api/ {
        proxy_pass http://dotnet-api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
